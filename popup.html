<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GoContact → Telepizza CRM</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

    :root {
      --bg:        #0d0f12;
      --surface:   #151820;
      --border:    #252a35;
      --accent:    #e8441a;
      --accent2:   #f07d3a;
      --green:     #2ecc71;
      --yellow:    #f1c40f;
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --mono:      'IBM Plex Mono', monospace;
      --sans:      'IBM Plex Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 11px;
      color: #fff;
      flex-shrink: 0;
    }
    .header-text h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .header-text p {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: 1px;
    }
    .status-dot {
      margin-left: auto;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      flex-shrink: 0;
    }

    /* ── Section ── */
    .section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* ── Data rows ── */
    .data-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .data-row:last-child { margin-bottom: 0; }
    .data-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
      margin-right: 8px;
    }
    .data-value {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      text-align: right;
      word-break: break-all;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }
    .data-value.empty { color: var(--muted); font-weight: 400; }
    .data-value.active { color: var(--accent2); }

    /* ── Site indicators ── */
    .sites {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .site-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .site-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .site-dot.ok  { background: var(--green); box-shadow: 0 0 4px var(--green); }
    .site-dot.off { background: var(--border); }
    .site-name {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      line-height: 1.3;
    }

    /* ── Buttons ── */
    .btn-row {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 8px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      text-transform: uppercase;
    }
    button:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    button:hover { opacity: 0.85; }

    /* ── Footer ── */
    .btn-admin {
      flex: 1;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(232,68,26,0.4);
      cursor: pointer;
      background: rgba(232,68,26,0.1);
      color: var(--accent2);
      text-transform: uppercase;
      transition: opacity 0.15s;
      width: 100%;
    }
    .btn-admin:hover { opacity: 0.8; }
    footer {
      padding: 8px 16px;
      text-align: center;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">GC</div>
    <div class="header-text">
      <h1>GoContact → Telepizza CRM</h1>
      <p>v1.0.0 · automatización activa</p>
    </div>
    <div class="status-dot" id="statusDot"></div>
  </header>

  <div class="section">
    <div class="section-title">Datos en memoria</div>
    <div class="data-row">
      <span class="data-label">TELÉFONO</span>
      <span class="data-value empty" id="valPhone">—</span>
    </div>
    <div class="data-row">
      <span class="data-label">TIENDA</span>
      <span class="data-value empty" id="valStore">—</span>
    </div>
    <div class="data-row">
      <span class="data-label">DIRECCIÓN</span>
      <span class="data-value empty" id="valAddress">—</span>
    </div>
    <div class="data-row">
      <span class="data-label">Nº PEDIDO</span>
      <span class="data-value empty" id="valOrder">—</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Sitios monitorizados</div>
    <div class="sites">
      <div class="site-card">
        <div class="site-dot ok"></div>
        <span class="site-name">GoContact</span>
      </div>
      <div class="site-card">
        <div class="site-dot ok"></div>
        <span class="site-name">Telepizza CRM</span>
      </div>
      <div class="site-card">
        <div class="site-dot ok"></div>
        <span class="site-name">Looker Studio</span>
      </div>
      <div class="site-card">
        <div class="site-dot ok"></div>
        <span class="site-name">telepizza.es</span>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-primary" id="btnRefresh">↻ Actualizar</button>
    <button class="btn-secondary" id="btnClear">Limpiar datos</button>
  </div>
  <div class="btn-row" style="padding-top:0">
    <button class="btn-admin" id="btnAdmin">⚙ Panel Admin</button>
  </div>

  <footer>© 2025 Miguel Ángel Torres Castrillon · Todos los derechos reservados</footer>

  <script src="popup.js"></script>
</body>
</html>
