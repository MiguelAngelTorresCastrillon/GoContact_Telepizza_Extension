<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>TeleGo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="32" height="32">
    <h1>TeleGo</h1>
  </header>

  <button id="toggle" class="toggle" role="switch" aria-checked="true">
    <span class="toggle-text">
      <strong id="state">Automatización activada</strong>
      <small id="hint">Pulsa para pausarla</small>
    </span>
    <span class="knob" aria-hidden="true"></span>
  </button>

  <section aria-label="Últimos datos">
    <div class="row" data-key="phone">
      <div>
        <span class="name">Teléfono</span>
        <span class="route">GoContact a Salesforce</span>
      </div>
      <div class="val"><b>—</b><time></time></div>
    </div>
    <div class="row" data-key="store">
      <div>
        <span class="name">Tienda</span>
        <span class="route">GoContact a Dataloop</span>
      </div>
      <div class="val"><b>—</b><time></time></div>
    </div>
    <div class="row" data-key="order">
      <div>
        <span class="name">Pedido</span>
        <span class="route">Telepizza a GoContact</span>
      </div>
      <div class="val"><b>—</b><time></time></div>
    </div>
  </section>

  <footer><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>T</kbd> activa o pausa TeleGo</footer>

  <script src="popup.js"></script>
</body>
</html>
